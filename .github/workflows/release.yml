# Builds, signs, notarizes and publishes Sela when a version tag is pushed, so a release is one
# command: git tag v0.1.4 && git push origin v0.1.4. The tag must match the version in the Xcode
# project. Installed copies of Sela pick the release up from its update feed.
#
# Needs these repository secrets:
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD  the Developer ID Application certificate, base64
#   NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER   an App Store Connect API key that can notarize
#   SPARKLE_KEY                                   the update signing key, from generate_keys -x
#   TEAM_ID                                       the Apple team that owns the certificate
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches the app's version
        run: |
          version=$(grep -m1 'MARKETING_VERSION' app/Sela.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }

      - name: Put the signing certificate and keys in place
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Build, notarize and make the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: scripts/release.sh "${{ secrets.TEAM_ID }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          products=.build/release/Build/Products/Release
          gh release create "$GITHUB_REF_NAME" --title "Sela ${GITHUB_REF_NAME#v}" --generate-notes \
              "$products/Sela.dmg" "$products"/Sela-*.zip "$products/appcast.xml" $(ls "$products"/*.delta 2>/dev/null)
          # A release made with this workflow's token doesn't start other workflows, so ask for the website by hand.
          gh workflow run website.yml --ref main

      - name: Remove the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
