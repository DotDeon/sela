# Automatic reviews on pull requests. The bot comments and suggests changes,
# but never approves: a maintainer approves every pull request into main.
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_filters:
    - "!website/public/media/**"
    - "!**/*.xcodeproj/**"
chat:
  auto_reply: true
